---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-cloud-controller-manager
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-cloud-controller-manager
      version: "1.30.1"
      sourceRef:
        kind: HelmRepository
        name: hetzner
        namespace: flux-system
  values:
    env:
      HCLOUD_LOAD_BALANCERS_LOCATION:
        value: fsn1
